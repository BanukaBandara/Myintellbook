# Hardened nginx site for https://www.myintellibook.com  (nginx 1.18+, Ubuntu)
#
# Layout assumed (adjust the paths marked ADJUST):
#   Vue build  -> /var/www/myintellibook/MIB_frontend/dist      (npm run build)
#   Laravel    -> /var/www/myintellibook/MIB_backend/public     (php-fpm)
#   API URL    -> https://www.myintellibook.com/api/...         (same origin as the SPA)
#
# Install:
#   sudo cp myintellibook.conf /etc/nginx/sites-available/myintellibook.conf
#   sudo cp snippets/myintellibook-security-headers.conf /etc/nginx/snippets/
#   sudo ln -sf /etc/nginx/sites-available/myintellibook.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Hide "nginx/1.18.0 (Ubuntu)" from the Server header and error pages.
server_tokens off;

# Basic request-rate guard in front of PHP (Laravel enforces the finer per-user limits).
limit_req_zone $binary_remote_addr zone=myib_api:10m rate=20r/s;

# --- HTTP: redirect everything to HTTPS (keep the ACME path for certbot renewals) -------------
server {
    listen 80;
    listen [::]:80;
    server_name myintellibook.com www.myintellibook.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;   # ADJUST to the webroot certbot uses, or remove with --nginx plugin
    }

    location / {
        return 301 https://www.myintellibook.com$request_uri;
    }
}

# --- HTTPS apex: canonicalise to www ---------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myintellibook.com;

    ssl_certificate     /etc/letsencrypt/live/www.myintellibook.com/fullchain.pem;   # ADJUST
    ssl_certificate_key /etc/letsencrypt/live/www.myintellibook.com/privkey.pem;     # ADJUST
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/myintellibook-security-headers.conf;
    return 301 https://www.myintellibook.com$request_uri;
}

# --- HTTPS www: the application ----------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myintellibook.com;

    ssl_certificate     /etc/letsencrypt/live/www.myintellibook.com/fullchain.pem;   # ADJUST
    ssl_certificate_key /etc/letsencrypt/live/www.myintellibook.com/privkey.pem;     # ADJUST
    include /etc/letsencrypt/options-ssl-nginx.conf;   # certbot's TLS 1.2/1.3 settings
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/myintellibook/MIB_frontend/dist;      # ADJUST
    index index.html;

    # Tribunal evidence uploads are limited to 20 MB by Laravel; allow some overhead.
    client_max_body_size 25m;
    client_body_timeout 30s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/myintellibook-security-headers.conf;

    # Never serve dotfiles (.env, .git, ...) except ACME challenges.
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    # --- Laravel API (/api/*) -> php-fpm, front controller only ---
    location ^~ /api/ {
        limit_req zone=myib_api burst=40 nodelay;

        # Laravel's SecurityHeaders middleware sends the security headers (and a stricter CSP)
        # for API responses. Declaring an add_header here stops nginx inheriting its own set,
        # so each header appears once instead of twice.
        add_header X-Robots-Tag "noindex, nofollow" always;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/myintellibook/MIB_backend/public/index.php;   # ADJUST
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/myintellibook/MIB_backend/public;              # ADJUST
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # ADJUST to your PHP version (php -v)
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Laravel public storage symlink (php artisan storage:link). Private uploads are NOT here.
    location ^~ /storage/ {
        alias /var/www/myintellibook/MIB_backend/public/storage/;   # ADJUST
        try_files $uri =404;
        location ~* \.(php|phtml|phar)$ { return 404; }
    }

    # --- Hashed build assets: cache for a year ---
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/myintellibook-security-headers.conf;
    }

    # --- Any other file with an extension (robots.txt, manifest.json, icons, ...) ---
    # Real 404 when missing, instead of falling through to index.html with a 200.
    location ~* \.[a-z0-9]{1,8}$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/myintellibook-security-headers.conf;
    }

    # --- SPA routes (/home, /profile, /tribunal/cases/42, ...) -> index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or users keep loading old bundle names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/myintellibook-security-headers.conf;
    }
}
