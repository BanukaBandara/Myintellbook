# Security headers for https://www.myintellibook.com
# Install as /etc/nginx/snippets/myintellibook-security-headers.conf
#
# nginx only inherits add_header from the enclosing block when a location defines none of its own,
# so every location that sets another header must `include` this file again.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Content Security Policy for the Vue SPA.
#  - script: the app bundle + Google Identity Services (Sign in with Google)
#  - style: 'unsafe-inline' is required by PrimeVue's runtime-injected theme styles
#  - img: profile/cover images are data: URIs; avatars can come from https URLs
# Roll-out tip: first deploy with the header name Content-Security-Policy-Report-Only, browse the
# whole site with DevTools open, fix anything reported, then switch to the enforcing name below.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
